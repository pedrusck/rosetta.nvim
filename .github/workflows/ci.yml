name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.12.5, v0.12.6]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - uses: jdx/mise-action@v3
        with:
          version: '2026.10.10'
      - name: Check formatting
        run: mise run format-check
      - name: Install LuaLS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            *) exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/luals"
          gh release download 3.19.1 --repo LuaLS/lua-language-server --pattern "lua-language-server-3.19.1-$platform.tar.gz" --output "$RUNNER_TEMP/luals.tar.gz"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "LUA_LS=$RUNNER_TEMP/luals/bin/lua-language-server" >> "$GITHUB_ENV"
      - run: mise run lint
      - run: mise run test
